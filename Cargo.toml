[workspace]
resolver = "3"
members = [
    "crates/rustbound_protocol",
    "crates/rustbound_api",
    "crates/rustbound_runtime",
    "crates/rustbound_compiler",
    "crates/rustbound_sim",
    "crates/rustbound_client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rustbound Systems Engineering Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustbound_protocol = { path = "crates/rustbound_protocol", default-features = false }
rustbound_api = { path = "crates/rustbound_api", default-features = false }
rustbound_runtime = { path = "crates/rustbound_runtime" }
rustbound_compiler = { path = "crates/rustbound_compiler" }
rustbound_sim = { path = "crates/rustbound_sim" }
rustbound_client = { path = "crates/rustbound_client" }

bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "x11",
    "bevy_winit",
    "bevy_clipboard",
    "custom_cursor",
    "sysinfo_plugin",
    "default_font",
    "default_app",
    "3d_bevy_render",
    "scene",
    "picking",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "tonemapping_luts",
] }
bevy_egui = { version = "0.43", default-features = false, features = ["default_fonts", "render", "bevy_ui"] }
bevy_ecs = { version = "0.20", default-features = false }
bevy_app = { version = "0.20", default-features = false }
wasmi = { version = "2.0", default-features = false, features = ["std", "deterministic", "validate"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
thiserror = { version = "2.0" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0" }
egui = { version = "0.36" }
egui_dock = { version = "0.21" }
ropey = { version = "1.6" }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
